[package]
name = "tiff"
version = "0.11.3"
edition = "2021"
resolver = "2"

# note: when changed, also update test runner in `.github/workflows/rust.yml`
rust-version = "1.99.0"

license = "MIT"
description = "TIFF decoding and encoding library in pure Rust"
authors = ["The image-rs Developers"]

repository = "https://github.com/image-rs/image-tiff"
categories = ["multimedia::images", "multimedia::encoding"]

exclude = [
    # Test fixtures & test source (downstream consumers don't build tests)
    "tests/",
    # Public-API surface snapshots (docs/public-api/, regenerated by tests)
    "docs/",
    # Bench source & fixtures (bench declarations kept above; files not needed downstream)
    "benches/",
    # CI configuration
    ".github/",
    # Dev tooling noise
    ".gitignore",
    "CLAUDE.md",
    "CONTEXT-HANDOFF.md",
    "FEEDBACK.md",
    ".claude/",
    ".superwork/",
    ".zenbench/",
    "copter-report/",
    "Cross.toml",
    "justfile",
    "Cargo.toml.original.txt",
    "fuzz/",
    # Public-API snapshot runner (own workspace, never built by this package)
    "apidoc/",
]

[dependencies]
half = { version = "2.7.1" }
quick-error = "2.0.1"

# Rename to avoid confusion with the feature name.
# 0.2.7 fixes a subtract-with-overflow panic on malformed CCITT input
# (fax-0.2.6 src/lib.rs:183, found by the fuzz farm — see #5). 0.3.0 widens
# image dimensions to u32, so CCITT images wider than 65,535 pixels decode.
fax34 = { package = "fax", version = "0.3.0", optional = true }
flate2 = { version = "1.1.10", optional = true }
weezl = { version = "0.2.1", optional = true }
zstd = { version = "0.14.3", optional = true }
zrip-decode = { version = "0.8.11", features = ["paranoid"], optional = true }
zune-jpeg = { version = "0.5.15", optional = true }
# Fork: LZMA (Compression 34925, libtiff's xz container with a Delta filter). Not optional:
# zenextras' zentiff selects tiff features by name and must still resolve against crates.io
# tiff 0.11.3, which has no `lzma` feature. Without `optimization` the crate forbids unsafe code.
lzma-rust2 = { version = "0.24.0", default-features = false, features = ["std", "xz"] }
# Fork: LERC (Compression 34887), not optional for the same reason as lzma-rust2.
lerc-rs = { version = "0.7.0", default-features = false, features = ["std"] }
image-webp = {version = "0.2.4", optional = true }

[dev-dependencies]
# Encodes xz streams (with libtiff's Delta + LZMA2 filter chain) for the LZMA decode tests.
lzma-rust2 = { version = "0.24.0", default-features = false, features = ["std", "xz", "encoder"] }
# Encodes the JPEG streams the old-style JPEG tests split into TIFF tables and strips.
jpeg-encoder = "0.7.1"
criterion = "0.8.2"
# Workspace standard for new benches (interleaved arms + paired statistics).
zenbench = "0.1.7"
zenutils-fuzz = "0.1.0"
# We may already depend on this via flate2
crc32fast = "1.5.1"
libtest-mimic = "0.8.2"
walkdir = "2.5.0"

[features]
default = ["deflate", "fax", "jpeg", "lzw"]

# Compression algorithms
deflate = ["dep:flate2"]
fax = ["dep:fax34"]
jpeg = ["dep:zune-jpeg"]
lzw = ["dep:weezl"]
webp = ["dep:image-webp"]
zstd = ["dep:zstd"]
# Fully safe Rust but somewhat slower Zstd decoding.
# When both zstd and zstd-safe-rust are enabled, zstd takes precedence.
zstd-safe-rust = ["dep:zrip-decode"]

[[bench]]
name = "lzw"
harness = false

[[bench]]
name = "encode"
harness = false

[[bench]]
name = "decode"
harness = false


[[test]]
name = "decode_libtiffpic"
path = "tests/decode_libtiffpic.rs"
harness = false

[[bench]]
name = "predictor_share"
harness = false
